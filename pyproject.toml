[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tirzah"
version = "1.16.2"
description = "Local graph-based memory and retrieval layer for LLM interactions."
readme = "README.md"
requires-python = ">=3.11"
keywords = [
  "llm",
  "memory",
  "retrieval",
  "graph",
  "mongodb",
  "ollama",
  "local-first",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "pydantic>=2.7",
  "pymongo>=4.7",
  "pyyaml>=6.0",
  # PyPI pins (git URLs are rejected by the package index).
  "hoglah>=0.10.4",  # SessionPriorityQueue + review-hardened queue runtime
  "galeed>=0.3.2",   # cross-project trace/log spine (negotiation note/phase)
  "deborah>=0.24.0", # process grammar + framed substrate (review-hardened)
  "keturah>=0.4.0",  # manifest + shared specialist envelope (REQUEST_FIELDS)
]

[project.optional-dependencies]
# Web UI / HTTP API (`tirzah serve`). Optional so library/CLI installs stay lean;
# the core never imports fastapi/uvicorn unless serving. A precursor to splitting
# the UI out once the HTTP API is a stable, versioned contract.
web = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]
dev = [
  "tirzah[web]",   # the web TestClient tests need fastapi
  "build>=1.2",
  "httpx>=0.27",
  "pytest>=8.0",
]
profiles = [
  "fastembed>=0.7",
]
tiktoken = [
  "tiktoken>=0.7",
]
# Semantic precision via Mahalath (the Tirzah->Mahalath seam, tirzah/semantic.py).
# Mahalath must be importable in Tirzah's environment for the package-level
# resolver: co-install it (shared venv) or `pipx inject tirzah mahalath`. Not on
# PyPI yet — install from the local repo / git until published.
mahalath = [
  "mahalath>=1.1.0",
]
# Specialist coherence/research via Milcah (the Tirzah->Milcah seam,
# tirzah/coherence.py). Off by default and fail-soft if absent; install this
# extra when `runtime.milcah_enabled` is true. Milcah's default specialist
# runtime submits role calls through Hoglah, so include Milcah's Hoglah extra.
milcah = [
  "milcah[hoglah]>=0.2.0",
]
hoglah = [
  "hoglah>=0.10.4",
]
hoglah-kafka = [
  "hoglah>=0.10.4",
  "confluent-kafka>=2.3",
]
hoglah-rabbitmq = [
  "hoglah>=0.10.4",
  "pika>=1.3",
]
hoglah-redis = [
  "hoglah>=0.10.4",
  "redis>=5.0",
]

[project.scripts]
tirzah = "tirzah.cli:main"
mnemosyne = "tirzah.cli:main"
tirzah-profile-helper = "tirzah.profile_helper:main_cli"

[project.urls]
Homepage = "https://github.com/gellsmore-svg/tirzah"
Repository = "https://github.com/gellsmore-svg/tirzah"
Issues = "https://github.com/gellsmore-svg/tirzah/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Mahlah-built UI (and any fallback static) under web/static/.
"tirzah.web" = ["static/**/*", "graph_explore.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "real_mongo: tests that require a reachable MongoDB service and exercise real collections/indexes",
]

[tool.ruff]
line-length = 120
# Pin the default-style rule set so upgrades do not silently expand CI.
# (Unpinned ruff on CI pulled in PLR/etc. and reported ~500 style nits.)
lint.select = ["E4", "E7", "E9", "F"]
lint.ignore = [
  "E402",  # late imports for optional deps
  "E731",  # seam lambdas
  "E741",  # math-ish single letters
]
