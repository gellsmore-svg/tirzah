name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  # Tag pushes match none of tests.yml's branch triggers, so run the suite
  # here and gate publishing on it.
  tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  release:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Tirzah
        uses: actions/checkout@v5

      - name: Checkout Mahlah (served UI)
        uses: actions/checkout@v5
        with:
          repository: gellsmore-svg/Mahlah
          path: Mahlah

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node (build Mahlah UI into tirzah.web.static)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build and install Mahlah UI
        env:
          MAHLAH_DIR: ${{ github.workspace }}/Mahlah
        run: |
          bash scripts/build_ui.sh

      - name: Build Python artifacts
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Validate Python artifacts install
        run: |
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1

          python -m venv /tmp/tirzah-release-wheel-smoke
          /tmp/tirzah-release-wheel-smoke/bin/pip install --upgrade pip
          /tmp/tirzah-release-wheel-smoke/bin/pip install dist/*.whl
          /tmp/tirzah-release-wheel-smoke/bin/tirzah --help
          /tmp/tirzah-release-wheel-smoke/bin/tirzah-profile-helper --help
          /tmp/tirzah-release-wheel-smoke/bin/python -c 'from importlib.resources import files; assert files("tirzah.web.static").joinpath("index.html").is_file()'

          python -m venv /tmp/tirzah-release-sdist-smoke
          /tmp/tirzah-release-sdist-smoke/bin/pip install --upgrade pip
          /tmp/tirzah-release-sdist-smoke/bin/pip install dist/*.tar.gz
          /tmp/tirzah-release-sdist-smoke/bin/tirzah --help
          /tmp/tirzah-release-sdist-smoke/bin/tirzah-profile-helper --help
          /tmp/tirzah-release-sdist-smoke/bin/python -c 'from importlib.resources import files; assert files("tirzah.web.static").joinpath("index.html").is_file()'

      - name: Validate Docker image builds
        run: |
          docker build -t tirzah:${GITHUB_REF_NAME} .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
