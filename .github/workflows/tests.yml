name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  # Called by release.yml so a tag cannot publish from a red tree.
  workflow_call:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          # Pin ruff major line so CI does not drift under unpinned latest.
          python -m pip install -e ".[dev]" "ruff>=0.4,<0.16"

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Run tests
        run: |
          python -m pytest

  optional-extras:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [milcah, mahalath, hoglah]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package with optional extra
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,${{ matrix.extra }}]"

      - name: Run seam tests
        continue-on-error: true
        run: |
          python -m pytest tests/test_coherence.py tests/test_semantic.py tests/test_hoglah_transport.py
