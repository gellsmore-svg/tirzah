mongo:
  uri: mongodb://localhost:27017
  # Existing renamed installs may keep mnemosyne_dev in local config.yaml.
  database: tirzah_dev

paths:
  ingest: data/ingest
  archive: data/archive
  dead_letter: data/dead_letter
  staging: data/staging

runtime:
  model_adapter: mock
  # Prefer ollama_http when the Ollama daemon is up but the CLI binary is not.
  answer_adapter: ollama_http
  ingestion_adapter: mock
  # Review-gated LLM chunking: set ingestion_adapter to "llm". Mock stays default.
  # ingestion_model_adapter: ollama_http   # or ollama_cli | kiro_cli | claude_cli | codex_cli | google_cli | grok_cli | hoglah | mock
  # ingestion_model: gemma3:1b
  # ingestion_fallback_to_mock: true
  # ingestion_max_source_chars: 24000
  embedding_adapter: mock
  # hybrid_search_enabled: true
  # Optional Atlas vector index on nodes.embedding.vector; empty uses a local scan.
  # vector_search_index: ""
  # hybrid_vector_scan_limit: 500
  # HTTP-backed embedding adapters are not compliant for ingestion/retrieval memory operations.
  allow_http_ingestion_adapters: false
  embedding_model: nomic-embed-text:latest
  embedding_dimensions: 16
  # Optional non-HTTP local profile generator. The command receives JSON on stdin:
  # {"model": "...", "text": "..."} and should return {"vector": [...]} or {"embedding": [...]}.
  profile_command: []
  # Use "worker" when the command reads one JSON request per line and returns one JSON response per line.
  profile_command_mode: single
  profile_backfill_recommended_batch_limit: 25
  profile_backfill_web_max_batches: 10
  memory_agent_adapter:
  retrieval_mode: direct
  # Versioned Deborah plan wrapper below the front end. The planner creates an
  # initial process, then revises it from new retrieval/execution information.
  recursive_planning_enabled: true
  planning_adapter:
  planning_model:
  planning_max_revisions: 3
  planning_max_steps: 12
  # Opt-in transient web evidence through a SearxNG JSON endpoint. For a local
  # SearxNG instance, web_allow_private_search_endpoint must be true; fetched result URLs still
  # receive scheme, redirect, size, and content-type checks.
  web_research_enabled: false
  web_search_base_url: http://localhost:8080
  web_timeout_seconds: 12
  web_max_results: 5
  web_max_pages: 2
  web_max_content_bytes: 500000
  web_max_content_chars: 8000
  web_allow_private_search_endpoint: false
  # API guardrails (see docs/install.md). web_localhost_only defaults True so
  # non-loopback clients are refused. Set web_api_token when you intentionally
  # open the API; misspellings are rejected (extra="forbid" on config models).
  web_api_token: ""
  web_localhost_only: true
  web_max_upload_bytes: 1000000
  # Optional Milcah specialist seam. Install with `pip install "tirzah[milcah]"`
  # (or co-install the local Milcah repo), then enable this so recursive planning
  # may dispatch coherence/counter-framework checks to Milcah. Fail-soft if absent.
  milcah_enabled: false
  milcah_model: ""
  ollama_model: gemma3:1b
  memory_agent_model:
  ollama_format:
  memory_agent_ollama_format: json
  ollama_think: false
  ollama_hide_thinking: true
  ollama_base_url: http://localhost:11434
  # Resolved from PATH by default (portable). Override for a non-PATH install,
  # e.g. a WSL-mounted Windows binary, or set the OLLAMA_EXECUTABLE env var:
  #   ollama_executable: /mnt/c/Users/<you>/AppData/Local/Programs/Ollama/ollama.exe
  ollama_executable: ollama
  ollama_timeout_seconds: 180
  # Optional Kiro CLI backend for answers and LLM ingestion.
  # Requires kiro-cli on PATH and KIRO_API_KEY or `kiro-cli login`.
  # kiro_executable: kiro-cli
  # kiro_timeout_seconds: 180
  # kiro_model:
  # kiro_agent:
  # kiro_effort:
  # kiro_trust_tools: ""
  # Optional Claude Code CLI (`claude -p`). Auth: ANTHROPIC_API_KEY or `claude` login.
  # claude_executable: claude
  # claude_timeout_seconds: 180
  # claude_model:
  # claude_max_turns: 1
  # claude_bare: true
  # Optional Codex CLI (`codex exec`). Auth: OPENAI_API_KEY or `codex login`.
  # codex_executable: codex
  # codex_timeout_seconds: 180
  # codex_model:
  # codex_sandbox: read-only
  # codex_ephemeral: true
  # Prefix sudo -n -E when the Linux sandbox needs elevation (NOPASSWD required).
  # codex_sudo: false
  # Optional Google Gemini CLI (`gemini -p`; adapter google_cli or gemini_cli).
  # Auth: GEMINI_API_KEY or `gemini` login.
  # google_executable: gemini
  # google_timeout_seconds: 180
  # google_model:
  # Optional Grok Build CLI (`grok --prompt-file`). Auth: XAI_API_KEY or `grok` login.
  # grok_executable: grok
  # grok_timeout_seconds: 180
  # grok_model:
  # grok_max_turns: 3
  # grok_no_auto_update: true
  # grok_disallowed_tools: run_terminal_cmd,search_replace,web_search,web_fetch,read_file,list_dir,grep
  # Optional Hoglah queue integration for answers AND embeddings. Install with
  # `pip install "tirzah[hoglah]"` and set answer_adapter / embedding_adapter to
  # "hoglah". Decoupled topology: Tirzah is a pure submitter into the shared
  # queue; run a SEPARATE worker daemon (pointed at the same db_path/output_dir),
  # e.g.:
  #   HOGLAH_OUTPUT_DIR=data/hoglah/outbox \
  #     hoglah run --real --db data/hoglah/jobs.sqlite3 \
  #     --ollama-host http://<host>:11434 -c 1
  # The "hoglah" embedding adapter is permitted for memory ops without
  # allow_http_ingestion_adapters (Tirzah does only local IPC; the daemon makes
  # the Ollama HTTP call).
  hoglah_db_path: data/hoglah/jobs.sqlite3
  hoglah_ollama_host: http://localhost:11434
  hoglah_use_real: true          # back-compat; unused by the submitter (daemon owns real exec)
  hoglah_wait_timeout_seconds:
  hoglah_output_dir: data/hoglah/outbox
  hoglah_delivery: poll          # "poll" the output folder, or "callback"
  hoglah_callback_host: 127.0.0.1
  hoglah_callback_port: 0         # 0 = OS-assigned ephemeral port

queue:
  max_attempts: 3

retrieval:
  context_char_budget: 4000
  prompt_token_budget: 2000
  reserved_response_tokens: 500
  memory_agent_max_iterations: 4

  # --- Interpretive Deborah plan execution (SPEC §4.6) -----------------------
  # Walk machine plans step-by-step (constructs, tool gating, resumable
  # executions, live plan streaming). Env: TIRZAH_PLAN_INTERPRETIVE_EXECUTION_ENABLED.
  # plan_interpretive_execution_enabled: false
  # Route crystallised substrate/critique graphs through Deborah's thin slice
  # (run_substrate_slice) instead of Tirzah's rich executor. Default on.
  # Env: TIRZAH_PLAN_FRAMED_EXECUTION_ENABLED.
  # plan_framed_execution_enabled: true
  # Soft-validate every plan against deborah.validate_plan; set true to fail
  # hard on conformance errors. Env: TIRZAH_PLAN_REQUIRE_DEBORAH_CONFORMANCE.
  # plan_require_deborah_conformance: false
  # plan_deborah_validate_profile: full
  # Consult the planner after each completed step and swap in a revised plan
  # when it says revise. Env: TIRZAH_PLAN_MID_REVISION_ENABLED.
  # plan_mid_revision_enabled: true
